version: '3.8'

services:
  campus-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-placement-ai
    ports:
      - "8501:8501"
    volumes:
      - ./data/datasets:/app/data/datasets
      - ./data/raw:/app/data/raw
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./src/models/saved_models:/app/src/models/saved_models
    environment:
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=campus_ai_2025
      - DB_NAME=campus_placement_ai
      - DEBUG=false
    depends_on:
      mysql_db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - campus-network

  mysql_db:
    image: mysql:8.0
    container_name: campus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: campus_ai_2025
      MYSQL_DATABASE: campus_placement_ai
      MYSQL_USER: campus_user
      MYSQL_PASSWORD: campus_pass_2025
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/database_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - campus-network

volumes:
  mysql_data:

networks:
  campus-network:
    driver: bridge
